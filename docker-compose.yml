services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-spidqah}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-spidqah}
      POSTGRES_DB: ${POSTGRES_DB:-spidqah}
    volumes:
      - spidqah_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-spidqah} -d ${POSTGRES_DB:-spidqah}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Not exposed publicly - only reachable from other containers on this network.

  web:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-spidqah}:${POSTGRES_PASSWORD:-spidqah}@db:5432/${POSTGRES_DB:-spidqah}
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8000}:5000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/auth/login')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

volumes:
  spidqah_postgres_data:
