{% extends "base.html" %}
{% from "_macros.html" import field %}
{% block title %}Change password{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-sm-8 col-md-5">
    <div class="card">
      <div class="card-body p-4">
        <h1 class="h4 mb-3">Change password</h1>
        <form method="post">
          {{ form.hidden_tag() }}
          {{ field(form.current_password) }}
          {{ field(form.new_password) }}
          {{ field(form.confirm_password) }}
          <button type="submit" class="btn btn-success btn-lg w-100">Update password</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
