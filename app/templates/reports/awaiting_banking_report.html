{% extends "base.html" %}
{% block title %}Awaiting Banking Report{% endblock %}
{% block content %}
<h1 class="h4 mb-3">Awaiting Banking Report</h1>
<div class="row g-3">
  <div class="col-12 col-md-4">
    <div class="card"><div class="card-body"><div class="text-muted small">Mukululo</div><div class="fs-4 fw-bold {{ 'text-danger' if mukululo_awaiting > 0 }}">{{ mukululo_awaiting | ugx }}</div></div></div>
  </div>
  <div class="col-12 col-md-4">
    <div class="card"><div class="card-body"><div class="text-muted small">Friday &amp; Sunday</div><div class="fs-4 fw-bold {{ 'text-danger' if fs_awaiting > 0 }}">{{ fs_awaiting | ugx }}</div></div></div>
  </div>
  <div class="col-12 col-md-4">
    <div class="card"><div class="card-body"><div class="text-muted small">Total</div><div class="fs-4 fw-bold">{{ total_awaiting | ugx }}</div></div></div>
  </div>
</div>
<p class="mt-3"><a href="{{ url_for('banking.monthly_view') }}">See month-by-month breakdown &rarr;</a></p>
{% endblock %}
