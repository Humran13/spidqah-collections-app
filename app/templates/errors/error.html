{% extends "base.html" %}
{% block title %}Error {{ code }}{% endblock %}
{% block content %}
<div class="text-center py-5">
  <h1 class="display-4">{{ code }}</h1>
  <p class="lead">{{ message }}</p>
  <a href="{{ url_for('main.dashboard') if current_user.is_authenticated else url_for('auth.login') }}" class="btn btn-success">Go home</a>
</div>
{% endblock %}
