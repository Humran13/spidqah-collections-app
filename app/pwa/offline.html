<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Offline</title>
  <style>
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; margin: 0; min-height: 100vh;

  <main>
    <h1>You are offline</h1>
